/* WEEKLY REPORT DATA RANGE / PLATFORM FIX */
(function(){
  const raw=()=>{try{return window.opener&&window.opener.__TCM_WEEKLY_REPORT_DATA__||{}}catch(e){return {}}};
  const val=(o,ks)=>{for(const k of ks){if(o&&o[k]!=null&&o[k]!=='')return o[k]}return ''};
  const n=v=>{v=Number(String(v==null?'':v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:0};
  const d=v=>__wrDate(v);
  const add=(date,off)=>{const x=new Date(date+'T00:00:00');x.setDate(x.getDate()+off);return x.toISOString().slice(0,10)};
  const platform=v=>__wrNormPlatform(v);
  const selectedPlatforms=()=>{
    const arr=[...document.querySelectorAll('.plat:checked')].map(x=>x.value);
    return arr.includes('TOTAL')?[]:arr;
  };
  const normalizeChannel=v=>{
    const s=String(v||'').trim().toLowerCase().replace(/\s+/g,'');
    if(s==='instagram'||s==='ig'||s.includes('인스타'))return 'Instagram';
    if(s==='youtube'||s==='youtu.be'||s==='yt'||s.includes('유튜브'))return 'Youtube';
    if(s==='tiktok'||s==='tik tok'||s==='tt'||s.includes('틱톡'))return 'Tiktok';
    if(s==='x'||s==='twitter'||s.includes('트위터'))return 'X';
    if(s==='blog'||s.includes('블로그'))return 'Blog';
    return String(v||'').trim();
  };
  const selectedChannels=()=>{
    const boxes=[...document.querySelectorAll('.wr-channel')];
    const arr=boxes.filter(x=>x.checked).map(x=>x.value);
    return !boxes.length||!arr.length?channels.slice():arr;
  };
  const channelOk=v=>selectedChannels().includes(normalizeChannel(v));
  const platformOk=(p,selected)=>!selected.length||selected.includes(platform(p));
  const itemName=x=>{
    if(x==null)return '';
    if(typeof x==='string')return x;
    return String(val(x,['name','product','productName','itemName','상품명','제품명','code','productCode','상품코드'])||'');
  };
  const itemCode=x=>String(val(x||{},['code','productCode','itemCode','상품코드','상품 코드'])||'');
  const rowDate=r=>d(val(r,['날짜','일자','date','Date','기준일','보고일','집계일']));
  const rowPlatform=r=>platform(val(r,['플랫폼','판매 채널','판매채널','광고 플랫폼','광고플랫폼','채널','platform','Platform']));
  const rowName=r=>String(val(r,['상품명','제품명','광고 상품명','광고상품명','productName','product','name'])||'').trim();
  const rowQty=r=>n(val(r,['실구매수량','실 구매 수량','판매수량','판매 수량','수량','qty','quantity','구매']));
  const rowRevenue=r=>n(val(r,['실구매금액','실 구매 금액','판매금액','판매 금액','매출','revenue','amount']));
  const firstDataArray=pools=>pools.find(x=>Array.isArray(x)&&x.length)||pools.find(Array.isArray)||[];
  const salesRows=()=>{
    const r=raw();
    return firstDataArray([r.metaRawSales,r.salesRows,r.salesSheetRows,r.metaSalesRows,r.channelSalesRows,r.channelSalesData,r.salesData,r.orgSalesData,r.sheetSnapshots&&r.sheetSnapshots.meta_sales]);
  };
  const adRows=()=>{
    const r=raw();
    return firstDataArray([r.metaRawAd,r.metaAdRows,r.adRows,r.metaDataRows,r.sheetSnapshots&&r.sheetSnapshots.meta_ad]);
  };
  const adProductRows=()=>{
    const r=raw();
    return firstDataArray([r.metaRawAdP,r.metaAdProductRows,r.adProductRows,r.sheetSnapshots&&r.sheetSnapshots.meta_adp,r.metaRawAd,r.metaAdRows]);
  };
  const fbKeyDate=(c,key)=>{
    if(/^\d{4}-\d{2}-\d{2}$/.test(key))return key;
    let m=String(key).match(/_d(-?\d+)$/)||String(key).match(/^d(-?\d+)$/);
    return m&&c.uploadDate?add(d(c.uploadDate),Number(m[1])):'';
  };
  const fbEntries=c=>Object.entries(c&&c._fbData||{}).map(([key,data])=>({date:fbKeyDate(c,key),data:data||{}})).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
  const sumItemField=(data,field)=>{
    const vals=Object.values(data&&data._itemData||{});
    const s=vals.reduce((a,x)=>a+n(x&&x[field]),0);
    return s||n(data&&data[field]);
  };
  const feedbackData=(s,e,selected)=>{
    const rows=raw().creators||[];
    const offsets=[-1,0,1,2,3,4,5,6];
    const norm=v=>String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,'');
    const itemUid=(it,pl)=>{
      it=it||{}; const direct=val(it,['uid','UID']); if(direct)return String(direct);
      const p=platform(pl);
      if(p==='MUSINSA')return String(val(it,['musinsaUid','musinsaUID','무신사 UID','무신사UID'])||'');
      if(p==='29CM')return String(val(it,['cmUid','cmUID','29CM UID','29CMUID','29cmUid'])||'');
      if(p==='STORE')return String(val(it,['storeUid','storeUID','자사몰 UID','자사몰UID'])||'');
      return '';
    };
    const itemKey=(it,pl)=>{
      const uid=itemUid(it,pl); if(uid)return 'uid:'+norm(pl)+'|'+norm(uid);
      const code=String(val(it,['code','productCode','상품코드','상품 코드'])||''); if(code)return 'code:'+norm(pl)+'|'+norm(code);
      return 'name:'+norm(pl)+'|'+norm(itemName(it));
    };
    const dayFor=(c,ci,off)=>{
      const fb=c&&c._fbData||{};
      const direct=fb[ci+'_d'+off]||fb['d'+off];
      if(direct)return direct;
      const suffix='_d'+off;
      const legacy=Object.keys(fb).find(k=>String(k).slice(-suffix.length)===suffix);
      return legacy?fb[legacy]||{}:{};
    };
    const itemData=(day,it,pl)=>{
      const pool=day&&day._itemData||{};
      const key=itemKey(it,pl);
      if(pool[key])return pool[key];
      const uid=itemUid(it,pl);
      if(uid){ const uk='uid:'+norm(pl)+'|'+norm(uid); if(pool[uk])return pool[uk]; }
      return {};
    };
    const metric=(c,ci,off)=>{
      const day=dayFor(c,ci,off);
      const items=(c.items||c.products||[]).filter(Boolean);
      let sales=0,revenue=0,productLike=0,itemClicks=0;
      items.forEach(it=>{ const x=itemData(day,it,c.platform); sales+=n(x.sales); revenue+=n(x.revenue); productLike+=n(x.productLike); itemClicks+=n(x.click); });
      if(!sales)sales=n(day.sales);
      if(!revenue)revenue=n(day.revenue);
      if(!productLike)productLike=n(day.productLike);
      const individual=String(c.linkType||'').trim()==='개별';
      const clicks=individual?itemClicks:n(day.click!=null?day.click:day.clicks);
      return {views:n(day.view!=null?day.view:day.views),comments:n(day.comment!=null?day.comment:day.comments),clicks,productLike,sales,revenue};
    };
    const entered=v=>v!=null&&String(v).trim()!==''&&n(v)!==0;
    return rows.filter(c=>{
      const up=d(c.uploadDate);
      return up&&inRange(up,s,e)&&platformOk(c.platform,selected)&&channelOk(val(c,['ch','channel','sns','media']));
    }).map(c=>{
      const ci=rows.indexOf(c),up=d(c.uploadDate);
      const total={views:0,comments:0,clicks:0,productLike:0,sales:0,revenue:0};
      offsets.forEach(off=>{
        const actual=add(up,off);
        if(!actual||actual>e)return;
        const m=metric(c,ci,off);
        if(entered(m.views))total.views=m.views;
        if(entered(m.comments))total.comments=m.comments;
        if(entered(m.productLike))total.productLike=m.productLike;
        total.clicks+=m.clicks;
        total.sales+=m.sales;
        total.revenue+=m.revenue;
      });
      const adCost=n(c.cost1),usageCost=n(c.cost2);
      const productCost=(c.items||c.products||[]).reduce((sum,it)=>sum+n(val(it||{},['cost','원가','costPrice','productCost','unitCost'])),0);
      const roas1Base=adCost+usageCost;
      const roas2Base=roas1Base+productCost;
      return {
        creator:val(c,['name','creator','creatorName','accountName'])||'-',
        followers:n(val(c,['followers','follower'])),
        channel:val(c,['ch','channel','sns','media'])||'-',
        type:val(c,['contentType','type'])||'-',
        upload:up,
        platform:platform(c.platform),
        views:total.views,
        comments:total.comments,
        clicks:total.clicks,
        ctr:total.views?total.clicks/total.views*100:0,
        likes:total.productLike,
        sales:total.sales,
        revenue:total.revenue,
        roas1:roas1Base?total.revenue/roas1Base*100:0,
        roas2:roas2Base?total.revenue/roas2Base*100:0,
        feeUsage:roas1Base,
        productCost:productCost,
        items:(c.items||c.products||[]).map(itemName).filter(Boolean)
      };
    }).sort((a,b)=>a.upload.localeCompare(b.upload)||String(a.creator).localeCompare(String(b.creator),'ko'));
  };
  const salesLift=(s,e,selected)=>{
    const ds=(new Date(e+'T00:00:00')-new Date(s+'T00:00:00'))/86400000+1;
    const ps=add(s,-ds),pe=add(e,-ds);
    const map={};
    for(const r of salesRows()){
      const dt=rowDate(r),pl=rowPlatform(r),name=rowName(r);
      if(!dt||!name||!platformOk(pl,selected))continue;
      map[name]=map[name]||{item:name,current:0,previous:0};
      if(inRange(dt,s,e))map[name].current+=rowQty(r);
      else if(inRange(dt,ps,pe))map[name].previous+=rowQty(r);
    }
    return Object.values(map).filter(x=>x.current||x.previous).sort((a,b)=>b.current-a.current||b.previous-a.previous).slice(0,30);
  };
  const metaData=(pl,s,e)=>{
    const daily={};
    for(const r of adRows()){
      const dt=rowDate(r),rp=rowPlatform(r);
      if(!dt||!inRange(dt,s,e)||!(pl==='TOTAL'||!rp||rp===pl))continue;
      const x=daily[dt]||(daily[dt]={spend:0,conv:0,indirectConv:0,directConv:0,sales:0,realPurchases:0,impressions:0,clicks:0,purchases:0,indirectPurchases:0,directPurchases:0,carts:0});
      x.spend+=n(val(r,['지출 금액','지출금액','지출','광고비','사용 금액','사용금액','spend','Spend','amount_spent']));
      x.conv+=n(val(r,['구매 전환값','구매전환값','구매 전환 가치','구매전환가치','purchase_value','conversionValue','Purchase conversion value','purchase_roas_value']));
      x.impressions+=n(val(r,['노출','노출수','노출 수','impressions']));
      x.clicks+=n(val(r,['링크 클릭','링크클릭','링크 클릭 수','클릭','link_clicks','clicks']));
      x.purchases+=n(val(r,['구매','구매 수','구매수','구매 건수','구매건수','purchases']));
      x.indirectPurchases+=n(val(r,['간접 구매','간접구매','조회 후 1일 구매','view_through_purchase','indirect_purchase']));
      x.directPurchases+=n(val(r,['직접 구매','직접구매','클릭 후 7일 구매','click_through_purchase','direct_purchase']));
      x.indirectConv+=n(val(r,['간접 구매 전환값','간접구매전환값','간접 전환값','간접전환값','view_through_purchase_value','indirect_purchase_value']));
      x.directConv+=n(val(r,['직접 구매 전환값','직접구매전환값','직접 전환값','직접전환값','click_through_purchase_value','direct_purchase_value']));
      x.carts+=n(val(r,['장바구니','장바구니 수','장바구니수','장바구니 추가','add_to_cart','addsToCart']));
      const sheetDailyPurch=val(r,['일 구매 건수','일구매건수','일 구매건수','일구매 건수','dailyPurchases','daily_orders']);
      const sheetDailySales=val(r,['일 매출','일매출','일 매출액','일매출액','dailySales','daily_revenue']);
      if(sheetDailyPurch!==''&&sheetDailyPurch!=null){x.realPurchases+=n(sheetDailyPurch);x.hasSheetDailyPurch=true;}
      if(sheetDailySales!==''&&sheetDailySales!=null){x.sales+=n(sheetDailySales);x.hasSheetDailySales=true;}
    }
    for(const r of salesRows()){
      const dt=rowDate(r),rp=rowPlatform(r);
      if(!dt||!inRange(dt,s,e)||!(pl==='TOTAL'||!rp||rp===pl))continue;
      const x=daily[dt]||(daily[dt]={spend:0,conv:0,indirectConv:0,directConv:0,sales:0,realPurchases:0,impressions:0,clicks:0,purchases:0,indirectPurchases:0,directPurchases:0,carts:0});
      if(!x.hasSheetDailyPurch)x.realPurchases+=rowQty(r);
      if(!x.hasSheetDailySales)x.sales+=rowRevenue(r);
    }
    const topMap={};
    for(const r of adProductRows()){
      const dt=rowDate(r),rp=rowPlatform(r),name=rowName(r)||String(val(r,['상품 코드','상품코드','UID'])||'').trim();
      if(!dt||!name||!inRange(dt,s,e)||!(pl==='TOTAL'||!rp||rp===pl))continue;
      topMap[name]=topMap[name]||[0,0];
      topMap[name][0]+=n(val(r,['광고 구매 수량','광고구매수량','광고 구매수량','광고 구매','광고구매','구매','구매수','purchases','구매 수량']));
    }
    for(const r of salesRows()){
      const dt=rowDate(r),rp=rowPlatform(r),name=rowName(r)||String(val(r,['상품 코드','상품코드','UID'])||'').trim();
      if(!dt||!name||!inRange(dt,s,e)||!(pl==='TOTAL'||!rp||rp===pl))continue;
      topMap[name]=topMap[name]||[0,0];
      topMap[name][1]+=rowQty(r);
    }
    return {
      daily:Object.keys(daily).sort().map(dt=>{const x=daily[dt];return [dt.slice(5).replace('-','/'),x.spend,x.conv,x.sales,x.impressions,x.clicks,x.purchases,x.carts,x.realPurchases,x.indirectPurchases,x.directPurchases,x.indirectConv,x.directConv]}),
      top:Object.entries(topMap).map(([k,v])=>[k,v[0],v[1]]).sort((a,b)=>(b[1]+b[2])-(a[1]+a[2])).slice(0,5)
    };
  };
  const seedSummary=(s,e,selected)=>{
    const map={}; let selectCount=0,exposureCount=0;
    for(const r of raw().seedData||[]){
      if(!channelOk(val(r,['ch','channel','sns','media'])))continue;
      const exposedDate=d(r.uploadDate||r.date);
      const exposed=!!(exposedDate&&inRange(exposedDate,s,e));
      for(const p of r.items||r.products||[]){
        const name=itemName(p); if(!name)continue;
        const pl=platform(p.platform||r.platform);
        if(!platformOk(pl,selected))continue;
        map[name]=map[name]||[name,0,0]; map[name][1]++; selectCount++;
        if(exposed){map[name][2]++;exposureCount++;}
      }
    }
    return {items:Object.values(map),selectCount,exposureCount};
  };
  const celebData=(s,e,selected)=>{
    const out=[];
    for(const r of raw().celebData||[]){
      if(!channelOk(val(r,['channel','ch','sns','media'])))continue;
      const date=d(r.date||r.exposureDate||r.uploadDate);
      if(!date||!inRange(date,s,e))continue;
      const products=r.products||r.items||[];
      const prodNames=products.map(itemName).filter(Boolean);
      const platforms=[];
      for(const pl of ['MUSINSA','29CM','STORE']){
        if(!platformOk(pl,selected))continue;
        let likes=0,sales=0,revenue=0;
        for(const p of products){
          const metrics=p.metrics||{};
          for(const [k,m] of Object.entries(metrics)){
            const off=String(k).match(/\d+/); const md=off?add(date,Number(off[0])-1):'';
            if(md&&md<=e){
              likes=Math.max(likes,n(m.productLike));
              if(md>=date){sales+=n(m.sales);revenue+=n(m.revenue);}
            }
          }
          const cd=p._celebData||{};
          for(const [k,m] of Object.entries(cd)){
            const md=/^\d{4}-/.test(k)?k:'';
            if(md&&md<=e){
              const pm=(m.platforms&&m.platforms[pl])||m[pl]||m;
              likes=Math.max(likes,n(pm.productLike||pm.likes));
              if(md>=date){sales+=n(pm.sales);revenue+=n(pm.revenue);}
            }
          }
        }
        if(likes||sales||revenue)platforms.push({platform:pl==='MUSINSA'?'무신사':pl==='STORE'?'자사몰':pl,likes,sales,revenue});
      }
      out.push({
        kind:val(r,['kind','category','division'])||'-',name:val(r,['name','celeb','celebrity'])||'-',
        channel:val(r,['channel','ch'])||'-',type:val(r,['contentType','type'])||'-',date,
        item:prodNames.join(', ')||'-',platforms,
        likes:platforms.reduce((a,x)=>a+x.likes,0),sales:platforms.reduce((a,x)=>a+x.sales,0),revenue:platforms.reduce((a,x)=>a+x.revenue,0)
      });
    }
    return out;
  };
  window.__wrFilteredMeta={};
  totalMetaData=function(){return window.__wrFilteredMeta.TOTAL||{daily:[],top:[]}};
  marketingCells=function(item,s,e){
    const selected=selectedPlatforms(),fb=feedbackData(s,e,selected),seed=seedSummary(s,e,selected),cb=celebData(s,e,selected);
    const earned=fb.filter(x=>x.items.includes(item)).map(x=>`${dateLabel(x.upload)} ${x.creator} ${x.type} 노출`).join('<br>');
    const ss=seed.items.find(x=>x[0]===item);
    const influencer=ss&&ss[2]?`시딩 ${ss[2]}건 노출`:'';
    const celeb=cb.filter(x=>x.item.split(', ').includes(item)).map(x=>`${dateLabel(x.date)} ${x.kind} ${x.name} 착용 노출`).join('<br>');
    let meta=0;
    for(const r of adRows()){
      if(rowName(r)!==item||!inRange(rowDate(r),s,e)||!platformOk(rowPlatform(r),selected))continue;
      meta+=n(val(r,['구매','구매수','purchases','구매 수량']));
    }
    return {earned,influencer,celeb,meta:meta?`Meta 전환 ${meta}개`:''};
  };
  metaPanel=function(pl,d,index){
    let spend=d.daily.reduce((a,b)=>a+b[1],0),conv=d.daily.reduce((a,b)=>a+b[2],0),sales=d.daily.reduce((a,b)=>a+b[3],0);
    let rows=d.daily.map(x=>{let impressions=x[4]||0,clicks=x[5]||0,purchases=x[6]||0,carts=x[7]||0,realPurchases=x[8]||0,indirectPurchases=x[9]||0,directPurchases=x[10]||0,indirectConv=x[11]||0,directConv=x[12]||0,cpc=clicks?x[1]/clicks:0,ctr=impressions?clicks/impressions*100:0,roas=x[1]?x[2]/x[1]*100:0,indirectRoas=x[1]?indirectConv/x[1]*100:0,directRoas=x[1]?directConv/x[1]*100:0;return `<tr><td>${metaDateLabel(x[0])}</td><td class="r">${won(x[1])}</td><td class="r">${num(impressions)}</td><td class="r">${num(clicks)}</td><td class="r">${won(Math.floor(cpc))}</td><td class="r">${pct2(ctr)}</td><td class="r">${num(purchases)}</td><td class="r meta-attrib-sub">${num(indirectPurchases)}</td><td class="r meta-attrib-sub">${num(directPurchases)}</td><td class="r">${won(x[2])}</td><td class="r meta-attrib-sub">${won(indirectConv)}</td><td class="r meta-attrib-sub">${won(directConv)}</td><td class="r">${pctFloor(roas)}</td><td class="r meta-attrib-sub">${pctFloor(indirectRoas)}</td><td class="r meta-attrib-sub">${pctFloor(directRoas)}</td><td class="r">${num(carts)}</td><td class="r">${num(realPurchases)}</td><td class="r">${won(x[3])}</td></tr>`}).join('');

    return `<div class="meta-panel ${index===0?'active':''}" data-meta-panel="${pl}"><div class="cards"><div class="mini">광고비<b>${won(spend)}</b></div><div class="mini">구매 전환값<b>${won(conv)}</b></div><div class="mini">실 매출<b>${won(sales)}</b></div><div class="mini">광고 ROAS<b>${spend?pctFloor(conv/spend*100):'-'}</b></div></div><div class="chart-card"><div class="chart-box"><canvas class="metaChart" data-platform="${pl}"></canvas></div></div><div><div class="chart-title">일별 광고 데이터</div><div class="table-wrap"><table><thead><tr><th>날짜</th><th class="r">지출 금액</th><th class="r">노출</th><th class="r">링크 클릭</th><th class="r">CPC</th><th class="r">CTR</th><th class="r">구매</th><th class="r meta-attrib-sub">간접</th><th class="r meta-attrib-sub">직접</th><th class="r">구매 전환값</th><th class="r meta-attrib-sub">간접 전환값</th><th class="r meta-attrib-sub">직접 전환값</th><th class="r">ROAS</th><th class="r meta-attrib-sub">간접 ROAS</th><th class="r meta-attrib-sub">직접 ROAS</th><th class="r">장바구니</th><th class="r">일 구매 건수</th><th class="r">일 매출</th></tr></thead><tbody>${rows||'<tr><td colspan="18" class="empty">해당 기간 내 데이터 없음</td></tr>'}</tbody></table></div></div><div><div class="chart-title">광고 구매 VS 실 구매 TOP 5</div><div class="table-wrap"><table><thead><tr><th>상품명</th><th class="r">광고 구매 수량</th><th class="r">실 구매 수량</th><th class="r">광고 기여율</th><th class="r">수량 증폭</th></tr></thead><tbody>${tops||'<tr><td colspan="5" class="empty">해당 기간 내 데이터 없음</td></tr>'}</tbody></table></div></div>${insights('meta-'+pl)}</div>`;
  };
  metaSection=function(selected,pn){let tabs=selected.map((pl,i)=>`<button class="meta-tab ${i===0?'active':''}" data-meta-tab="${pl}" onclick="showMetaTab('${pl}')">${pl==='MUSINSA'?'무신사':pl}</button>`).join('');let panels=selected.map((pl,i)=>metaPanel(pl,window.__wrFilteredMeta[pl]||{daily:[],top:[]},i)).join('');return `<section class="page">${pageHead('06 · META','Meta 광고 성과','선택한 보고서 기간 내 데이터만 집계')}<div class="meta-tabs">${tabs}</div>${panels}${footer(pn)}</section>`};
  drawCharts=function(){document.querySelectorAll('.metaChart').forEach(c=>{if(c.dataset.drawn)return;let d=window.__wrFilteredMeta[c.dataset.platform]||{daily:[]};let spend=d.daily.map(x=>x[1]),conversion=d.daily.map(x=>x[2]),roas=d.daily.map(x=>x[1]?x[2]/x[1]*100:0);let chart=new Chart(c,{data:{labels:d.daily.map(x=>metaDateLabel(x[0])),datasets:[{type:'bar',label:'지출',data:spend,backgroundColor:'#c0392b',yAxisID:'y',order:2},{type:'bar',label:'구매 전환값',data:conversion,backgroundColor:'#f2c94c',yAxisID:'y',order:2},{type:'line',label:'ROAS',data:roas,borderColor:'#2f6fed',backgroundColor:'#2f6fed',yAxisID:'y1',order:0}]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true},y1:{position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{callback:v=>Math.floor(v)+'%'}}}}});c.dataset.drawn='1';c._chart=chart})};
  renderReport=function(){
    const s=document.getElementById('startDate').value,e=document.getElementById('endDate').value;if(!s||!e||s>e){alert('기간을 올바르게 선택해주세요.');return}

    const fb=feedbackData(s,e,selected),crm=sample.crm.filter(x=>inRange(x.date,s,e)&&platformOk(x.platform,selected)),seed=seedSummary(s,e,selected),cb=celebData(s,e,selected);
    const metaTabs=selectedUi.length?selectedUi:['TOTAL'];
    window.__wrFilteredMeta={};metaTabs.forEach(pl=>window.__wrFilteredMeta[pl]=metaData(pl,s,e));
    let pages=[],pn=1,totalSales=fb.reduce((a,b)=>a+b.revenue,0),totalViews=fb.reduce((a,b)=>a+b.views,0),totalMeta=Object.values(window.__wrFilteredMeta).flatMap(x=>x.daily).reduce((a,b)=>a+b[1],0);
    if(mods.includes('추가 리포트')){
      let a=new Date(s+'T00:00:00'),b=new Date(e+'T00:00:00'),days=Math.round((b-a)/86400000)+1,ps=add(s,-days),pe=add(e,-days);
      let lift=salesLift(s,e,selected),rows=lift.map((x,i)=>{let diff=x.current-x.previous,rate=x.previous?diff/x.previous*100:0,c=marketingCells(x.item,s,e);return `<tr><td><b>${x.item}</b></td><td class="sales-status"><b>금주 (${shortDate(s)}~${shortDate(e)}) ${num(x.current)}건</b><br>전주 (${shortDate(ps)}~${shortDate(pe)}) ${num(x.previous)}건<br><span style="color:${diff>=0?'var(--green)':'var(--red)'}">증감 ${diff>=0?'+':''}${num(diff)}건 / 증감률 ${diff>=0?'+':''}${pct(rate)}</span></td><td><div class="editable-cell" contenteditable="true" data-edit="analysis-${i}-earned">${c.earned}</div></td><td><div class="editable-cell" contenteditable="true" data-edit="analysis-${i}-influencer">${c.influencer}</div></td><td><div class="editable-cell" contenteditable="true" data-edit="analysis-${i}-celeb">${c.celeb}</div></td><td><div class="editable-cell" contenteditable="true" data-edit="analysis-${i}-meta">${c.meta}</div></td></tr>`}).join('');
      pages.push(`<section class="page">${pageHead('01 · ANALYSIS','마케팅 노출 × 판매 증가 분석','선택 플랫폼·기간 기준 판매 변화와 마케팅 액션 비교')}<div class="table-wrap"><table class="analysis-table"><thead><tr><th style="width:15%">상품명</th><th style="width:22%">판매 현황</th><th>Earned Media</th><th>Influencer</th><th>Celeb</th><th>Meta</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">해당 기간 내 판매 데이터 없음</td></tr>'}</tbody></table></div>${insights('analysis')}${footer(pn++)}</section>`);
    }
    if(mods.includes('Feedback')){
      let rows=fb.map(r=>`<tr><td>${r.creator}</td><td class="r">${num(r.followers)}</td><td>${r.channel}</td><td>${r.type}</td><td>${dateLabel(r.upload)}</td><td>${r.platform}</td><td class="r">${num(r.views)}</td><td class="r">${num(r.comments)}</td><td class="r">${num(r.clicks)}</td><td class="r">${pct2(r.ctr)}</td><td class="r">${num(r.likes)}</td><td class="r">${num(r.sales)}</td><td class="r">${won(r.revenue)}</td><td class="r">${pctFloor(r.roas1)}</td><td class="r">${pctFloor(r.roas2)}</td></tr>`).join('');

    if(mods.includes('Meta')&&metaTabs.length)pages.push(metaSection(metaTabs,pn++));

})();
